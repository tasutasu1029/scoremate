<style>
:root {
  --bg: #F3EFE7; --surface: #FFFFFF; --fill: #EAE5DB; --line: #E2DCD0;
  --ink: #1A1A24; --ink2: #6D685F; --ink3: #A39E94;
  --accent: #3C4FD6; --accentSoft: #E3E6FB; --onAccent: #FFFFFF; --error: #B3261E;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111116; --surface: #1C1C23; --fill: #2A2A33; --line: #2E2E38;
    --ink: #F2EFE9; --ink2: #A29E97; --ink3: #6C6973;
    --accent: #7D8EFF; --accentSoft: #262B52; --error: #FF8A80;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; }
main { max-width: 720px; margin: 0 auto; display: grid; gap: 14px;
  padding: calc(env(safe-area-inset-top) + 28px) max(20px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 28px) max(20px, env(safe-area-inset-left)); }
h1 { margin: 0 0 6px; font-size: 34px; font-weight: 900; letter-spacing: .01em; }
.card { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 22px; background: var(--surface);
  color: inherit; text-decoration: none; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
.card:active { transform: scale(.985); }
.card img { width: 64px; height: 84px; object-fit: cover; object-position: top; border-radius: 10px; background: var(--fill); flex: none; }
.card .t { min-width: 0; }
.card b { display: block; font-size: 19px; font-weight: 800; }
.card span { display: block; margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--ink2); }
.foot { margin-top: 18px; display: flex; justify-content: center; }
.foot button { font: inherit; font-size: 12px; font-weight: 700; color: var(--ink3); background: none; border: 0; padding: 8px; }
</style>
</head>

SiteLib.open(LIST).then(items => {
  const list = document.getElementById("list");
  list.style.display = "grid"; list.style.gap = "12px";
  for (const it of items) {
    const a = document.createElement("a");
    a.className = "card"; a.href = it.href;
    if (it.thumb) { const img = document.createElement("img"); img.src = it.thumb; img.alt = ""; a.appendChild(img); }
    const t = document.createElement("div"); t.className = "t";
    const b = document.createElement("b"); b.textContent = it.title;
    const s = document.createElement("span"); s.textContent = it.sub;
    t.append(b, s); a.appendChild(t); list.appendChild(a);
  }
});
document.getElementById("forget").onclick = () => { SiteLib.forget(); location.reload(); };
